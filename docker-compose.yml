version: "3.8"

services:
  app:
    build: .
    container_name: family_budget_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: family_budget_redis
    restart: unless-stopped
    command: redis-server --maxmemory 50mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"

  caddy:
    profiles: ["web"]
    image: caddy:2-alpine
    container_name: family_budget_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    container_name: family_budget_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  caddy_data:
  caddy_config:
  ollama_data:
